[project]
name = "pulse"
version = "0.1.0"
description = "Public-transport-first urban and suburban transport planning and simulation platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "geoalchemy2>=0.15",
  "pandas>=2.2",
  "numpy>=2.0",
  "geopandas>=1.0",
  "shapely>=2.0",
  "networkx>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
